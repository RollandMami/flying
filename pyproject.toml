[project]
name = "flyin"
version = "0.1.0"
description = "Max flow - min cost"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "pydantic>=2.13.4,<3.0.0",
    "pyfiglet>=1.0.4,<2.0.0",
    "pygame>=2.6.1,<3.0.0",
    "webcolors>=25.10.0,<26.0.0",
]

[[tool.mypy.overrides]]
module = "webcolors.*"
ignore_missing_imports = true

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=2.3.1",
]
